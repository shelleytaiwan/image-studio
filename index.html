<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shelley的影像工作站</title>
<style>
  :root{
    --bg: #ececec;
    --card-bg: #ffffff;
    --ink: #2b2823;
    --accent: #7a6a52;
    --shadow: rgba(43, 40, 35, 0.10);
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 64px 24px 96px;
  }

  header{
    text-align: center;
    margin-bottom: 56px;
  }

  .eyebrow{
    font-size: 13px;
    letter-spacing: 0.18em;
    color: var(--accent);
    margin-bottom: 12px;
  }

  h1{
    font-size: clamp(28px, 5vw, 44px);
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .icon-card{
    display: block;
    background: var(--card-bg);
    border-radius: 24px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 20px;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .icon-card:hover{
    transform: translateY(-4px);
    box-shadow: 0 14px 30px var(--shadow);
  }

  .icon-card:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 3px;
  }

  .icon-card img{
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 16px;
    display: block;
  }

  footer{
    text-align: center;
    margin-top: 64px;
    font-size: 13px;
    color: #999;
    letter-spacing: 0.02em;
  }
</style>
</head>
